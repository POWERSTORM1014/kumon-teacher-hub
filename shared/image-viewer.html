<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>교재 원본 · 정답 보기 — 구몬 학습 허브</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ef; --surface:#ffffff; --border:#e8e4dc; --ink:#1a1814; --ink-mid:#6a6258; --ink-light:#aaa49c;
  --accent:#e8401c; --accent-light:#fde8e3;
  --font:'Noto Sans KR',sans-serif; --mono:'DM Mono',monospace;
  --shadow:0 2px 12px rgba(0,0,0,0.08); --shadow-lg:0 8px 32px rgba(0,0,0,0.12); --radius:14px;
}
body.dark{ --bg:#0e0c0a; --surface:#1a1814; --border:#2a2820; --ink:#d8d0c0; --ink-mid:#6a6258; --ink-light:#3a3830; --accent-light:rgba(232,64,28,0.12); }
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}

.header{background:var(--accent);padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(232,64,28,0.3);flex-shrink:0;}
.header a{color:#fff;text-decoration:none;font-size:13px;opacity:.9;}
.header a:hover{opacity:1;text-decoration:underline;}
.header .title{color:#fff;font-size:15px;font-weight:800;flex:1;}
.header .badge{font-family:var(--mono);font-size:11px;color:#fff;background:rgba(255,255,255,0.2);padding:3px 9px;border-radius:10px;}

.body-wrap{flex:1;display:flex;min-height:0;}

#sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:10px;}
#sidebar h2{font-size:12px;font-weight:800;color:var(--ink-mid);margin:4px 4px 10px;letter-spacing:.03em;}
.thumb{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;margin-bottom:4px;}
.thumb:hover{background:var(--accent-light);}
.thumb.active{background:var(--accent);color:#fff;}
.thumb img{width:36px;height:58px;object-fit:cover;border-radius:3px;background:#fff;border:1px solid var(--border);flex-shrink:0;}
.thumb span{font-size:12.5px;font-family:var(--mono);}

#main{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;overflow:auto;min-width:0;}
#toolbar{display:flex;align-items:center;gap:16px;margin-bottom:16px;background:var(--surface);border:1px solid var(--border);padding:10px 18px;border-radius:var(--radius);box-shadow:var(--shadow);flex-wrap:wrap;justify-content:center;}
#toolbar button{background:var(--accent);border:none;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-family:var(--font);font-weight:700;}
#toolbar button:hover{filter:brightness(1.08);}
#toolbar button:disabled{background:var(--ink-light);cursor:default;filter:none;}
#toolbar label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none;color:var(--ink);}
#toolbar input[type=checkbox]{width:17px;height:17px;cursor:pointer;accent-color:var(--accent);}
#pageLabel{font-size:14px;font-weight:700;min-width:70px;text-align:center;font-family:var(--mono);color:var(--ink);}

#stage{position:relative;background:#fff;box-shadow:var(--shadow-lg);border-radius:4px;overflow:hidden;}
#stage img{position:absolute;top:0;left:0;width:100%;height:100%;display:block;}
#baseImg{z-index:1;}
#overlayImg{z-index:2;}

#statusMsg{color:var(--ink-mid);font-size:13px;padding:40px;text-align:center;}
</style>
</head>
<body>

<div class="header">
  <a href="../index.html">← 구몬 학습 허브</a>
  <div class="title" id="headerTitle">교재 원본 · 정답 보기</div>
  <div class="badge" id="headerBadge"></div>
</div>

<div class="body-wrap">
  <div id="sidebar" style="display:none;">
    <h2 id="sidebarTitle">페이지</h2>
    <div id="thumbList"></div>
  </div>

  <div id="main">
    <div id="statusMsg">불러오는 중...</div>
  </div>
</div>

<script src="./image-viewer.js"></script>
</body>
</html>
