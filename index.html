<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>구몬 학습 허브</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e8401c">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ef; --surface:#ffffff; --border:#e8e4dc; --ink:#1a1814; --ink-mid:#6a6258; --ink-light:#aaa49c;
  --accent:#e8401c; --accent-light:#fde8e3;
  --font:'Noto Sans KR',sans-serif; --mono:'DM Mono',monospace;
  --shadow:0 2px 12px rgba(0,0,0,0.08); --shadow-lg:0 8px 32px rgba(0,0,0,0.12); --radius:14px;
}
body.dark{ --bg:#0e0c0a; --surface:#1a1814; --border:#2a2820; --ink:#d8d0c0; --ink-mid:#6a6258; --ink-light:#3a3830; --accent-light:rgba(232,64,28,0.12); }
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;}

.header{background:var(--accent);padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(232,64,28,0.3);}
.logo{display:flex;align-items:center;gap:10px;color:#fff;}
.logo-icon{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:18px;}
.logo-title{font-size:17px;font-weight:800;}
.header-spacer{flex:1;}
.search-wrap{position:relative;width:min(420px,100%);}
.search-input{width:100%;padding:10px 42px 10px 16px;border-radius:22px;border:none;background:rgba(255,255,255,0.92);font-family:var(--font);font-size:13px;color:var(--ink);outline:none;}
.search-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ink-light);font-size:14px;pointer-events:none;}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);max-height:360px;overflow-y:auto;box-shadow:var(--shadow-lg);z-index:300;display:none;}
.search-group-title{padding:8px 14px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-light);background:var(--bg);}
.search-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);}
.search-item:hover{background:var(--accent-light);}
.search-item .si-badge{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-light);padding:2px 7px;border-radius:6px;flex-shrink:0;}
.search-item .si-text{font-size:13px;color:var(--ink);}
.search-item .si-sub{font-size:11px;color:var(--ink-mid);margin-top:1px;}
.search-empty{padding:16px;text-align:center;color:var(--ink-mid);font-size:12px;}
.header-btn{padding:7px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.35);background:none;color:#fff;font-size:12px;font-family:var(--font);cursor:pointer;flex-shrink:0;}
.header-btn:hover{background:rgba(255,255,255,0.15);}

.statusline{height:30px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;font-size:11.5px;font-family:var(--mono);color:var(--ink-mid);flex-wrap:wrap;}
.statusline .sl-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-light);flex-shrink:0;}
.statusline.online .sl-dot{background:#1aad6e;}
.statusline.offline .sl-dot{background:#f5a623;}
.sl-item{display:flex;align-items:center;gap:6px;}

.main{max-width:1100px;margin:0 auto;padding:28px 20px 60px;}
.section-title{font-size:13px;font-weight:800;color:var(--ink-mid);letter-spacing:.04em;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.section{margin-bottom:36px;}

.recent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.recent-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:box-shadow .15s,transform .15s;}
.recent-card:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
.recent-card .rc-subject{font-size:10px;color:var(--accent);font-weight:700;margin-bottom:4px;}
.recent-card .rc-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.recent-card .rc-time{font-size:11px;color:var(--ink-light);font-family:var(--mono);}
.empty-hint{color:var(--ink-light);font-size:12.5px;padding:8px 2px;}

.subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;}
.subject-card{position:relative;border-radius:var(--radius);padding:22px 18px;cursor:pointer;color:#fff;overflow:hidden;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;}
.subject-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
.subject-card .sc-icon{font-size:30px;margin-bottom:10px;}
.subject-card .sc-name{font-size:16px;font-weight:800;}
.subject-card.coming-soon{opacity:.55;cursor:default;}
.subject-card.coming-soon:hover{transform:none;}
.sc-badge{position:absolute;top:12px;right:12px;font-size:9px;font-weight:700;background:rgba(255,255,255,0.25);padding:3px 8px;border-radius:10px;}

/* "나의 폴더" — subjects/archives의 색색 타일과 달리 사용자가 만든 폴더라 정해진
   색이 없다. surface/border 톤의 중립 카드로 표시하고, 이름변경/삭제 아이콘을
   카드 우상단에 얹는다. */
.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;}
.folder-card{position:relative;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);padding:20px 16px 16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;min-height:110px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;}
.folder-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
.folder-card .fc-icon{font-size:26px;}
.folder-card .fc-name{font-size:14.5px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.folder-card .fc-actions{position:absolute;top:10px;right:10px;display:flex;gap:4px;}
.fc-icon-btn{width:24px;height:24px;border-radius:6px;border:none;background:var(--bg);color:var(--ink-mid);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.fc-icon-btn:hover{background:var(--accent-light);color:var(--accent);}
.add-tile{border:1.5px dashed var(--border);border-radius:var(--radius);background:none;color:var(--ink-mid);min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:700;}
.add-tile:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.add-tile .at-icon{font-size:22px;}

/* 폴더 이름 입력 팝업 */
#name-prompt-modal{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;padding:16px;}
#name-prompt-modal.open{display:flex;}
.np-box{background:var(--surface);border-radius:14px;width:min(320px,100%);padding:20px;box-shadow:var(--shadow-lg);}
.np-title{font-size:14px;font-weight:700;margin-bottom:12px;}
.np-input{width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;margin-bottom:14px;}
.np-actions{display:flex;justify-content:flex-end;gap:8px;}
.np-btn{padding:8px 16px;border-radius:8px;border:1.5px solid var(--border);background:none;color:var(--ink);font-family:var(--font);font-size:12.5px;cursor:pointer;}
.np-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}

/* 알림 토스트 — subjects/archives/workspace 뷰어(viewer.js의 showToast)와 완전히
   같은 모양/타이밍으로 맞춘다. 허브 화면(index.html)에는 이 토스트 자체가 지금까지
   없었다 — "나의 폴더" 생성/이름변경/삭제 결과를 알려줄 곳이 필요해서 추가한다. */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:#1a1814;color:#d8d0c0;padding:10px 20px;border-radius:20px;font-size:12px;opacity:0;pointer-events:none;transition:all 0.25s;z-index:900;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="header">
  <div class="logo"><div class="logo-icon">📚</div><div class="logo-title">구몬 학습 허브</div></div>
  <div class="header-spacer"></div>
  <div class="search-wrap">
    <input class="search-input" id="search-input" placeholder="🔍 전체 교재·단원 검색..." oninput="onSearchInput(this.value)" onkeydown="if(event.key==='Escape') clearSearch();">
    <span class="search-icon">🔍</span>
    <div class="search-results" id="search-results"></div>
  </div>
  <button class="header-btn" onclick="toggleDark()">🌙 다크</button>
</div>

<div class="statusline" id="statusline">
  <span class="sl-item"><span class="sl-dot"></span><span id="sl-server">서버 확인 중…</span></span>
  <span class="sl-item">📱 <span id="sl-device">—</span></span>
  <span class="sl-item">🕓 마지막 동기화: <span id="sl-lastsync">—</span></span>
</div>

<div class="main">
  <div class="section" id="recent-section">
    <div class="section-title">🕓 최근 학습</div>
    <div class="recent-grid" id="recent-grid"></div>
  </div>

  <div class="section">
    <div class="section-title">📚 교과목 학습</div>
    <div class="subject-grid" id="subject-grid"></div>
  </div>

  <div class="section">
    <div class="section-title">🗂️ 자료실</div>
    <div class="subject-grid" id="archive-grid"></div>
  </div>

  <div class="section">
    <div class="section-title">📁 나의 폴더</div>
    <div class="folder-grid" id="folder-grid"></div>
  </div>
</div>

<div id="name-prompt-modal">
  <div class="np-box">
    <div class="np-title" id="np-title">이름</div>
    <input type="text" class="np-input" id="np-input" maxlength="60" onkeydown="if(event.key==='Enter'){event.preventDefault();closeNamePrompt(true);} if(event.key==='Escape'){closeNamePrompt(false);}">
    <div class="np-actions">
      <button class="np-btn" onclick="closeNamePrompt(false)">취소</button>
      <button class="np-btn primary" onclick="closeNamePrompt(true)">확인</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="shared/annotation-engine.js"></script>
<script>
const Engine = AnnotationEngine;
let subjects = [];
let archives = [];
let folders = [];
let searchDataCache = null;

function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// subjects/archives/workspace 뷰어(viewer.js)의 showToast()와 완전히 같은 구현 —
// 허브 화면에는 이 알림 표시 함수가 지금까지 없었다("나의 폴더" 생성/이름변경/삭제
// 결과를 알려줄 일이 이번에 처음 생김).
function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function toggleDark() {
  const on = document.body.classList.toggle('dark');
  localStorage.setItem('ann:dark', on ? '1' : '0');
}
if (localStorage.getItem('ann:dark') === '1') document.body.classList.add('dark');

async function loadSubjects() {
  try {
    const res = await fetch('subjects.json', { cache: 'no-store' });
    subjects = await res.json();
  } catch (e) { subjects = []; }
  renderSubjectGrid();
}

// 자료실(연구대회 수상작·연수자료·소식지·교육원론·수업사례) — subjects.json/subjects/와
// 완전히 별도인 archives.json/archives/를 읽어서 별도 구획에 렌더링한다. 기존 과목
// 타일 렌더링(renderSubjectGrid)은 여기서 건드리지 않는다.
async function loadArchives() {
  try {
    const res = await fetch('archives.json', { cache: 'no-store' });
    archives = await res.json();
  } catch (e) { archives = []; }
  renderArchiveGrid();
}
function renderArchiveGrid() {
  const grid = document.getElementById('archive-grid');
  grid.innerHTML = archives.map(a => `
    <div class="subject-card" style="background:${a.color || '#888'};" onclick="openSubject('${a.viewer}')">
      <div class="sc-icon">${a.icon || '📘'}</div>
      <div class="sc-name">${a.name}</div>
    </div>`).join('');
}

/* ── "나의 폴더" — subjects.json/archives.json과 달리 정적 파일이 아니라 KV 기반
   동적 데이터라, 페이지를 열 때마다 Engine.Storage.listFolders()로 매번 새로
   받아온다(정적 캐시 대상 아님). 여기서 직접 fetch를 호출하지 않는 이유는
   annotation-engine.js의 "fetch는 Storage 모듈 안에서만" 원칙 때문이다. ── */
async function loadFolders() {
  folders = await Engine.Storage.listFolders();
  renderFolderGrid();
}
function renderFolderGrid() {
  const grid = document.getElementById('folder-grid');
  const addTile = `<button class="add-tile" onclick="createFolderUI()"><span class="at-icon">➕</span>새 폴더 만들기</button>`;
  if (!folders.length) {
    grid.innerHTML = addTile;
    const hint = document.createElement('div');
    hint.className = 'empty-hint'; hint.style.gridColumn = '1/-1';
    hint.textContent = '아직 만든 폴더가 없어요 — 위 버튼으로 첫 폴더를 만들어보세요.';
    grid.appendChild(hint);
    return;
  }
  // 카드 onclick에는 folder.id(서버가 만든 hex 접미어라 안전)만 넘긴다 — 폴더 이름은
  // 사용자가 자유 입력한 텍스트라 그대로 JS 문자열 리터럴에 꽂으면 따옴표 등으로
  // 코드가 깨지거나 삽입될 수 있다. 이름이 필요한 곳(openFolder)은 folders 배열에서
  // id로 다시 찾아 쓴다.
  grid.innerHTML = folders.map(f => `
    <div class="folder-card" onclick="openFolder('${f.id}')">
      <div class="fc-actions">
        <button class="fc-icon-btn" onclick="event.stopPropagation();renameFolderUI('${f.id}')" title="이름 바꾸기">✎</button>
        <button class="fc-icon-btn" onclick="event.stopPropagation();deleteFolderUI('${f.id}')" title="삭제">🗑</button>
      </div>
      <div class="fc-icon">📁</div>
      <div class="fc-name">${escapeHtml(f.name)}</div>
    </div>`).join('') + addTile;
}
function openFolder(folderId) {
  const f = folders.find(x => x.id === folderId);
  location.href = 'workspace/folder.html?folder=' + encodeURIComponent(folderId) + '&name=' + encodeURIComponent(f ? f.name : '');
}
// 생성/이름변경/삭제 뒤에는 loadFolders()로 다시 fetch하지 않고, 서버가 돌려준(또는
// 우리가 이미 아는) 값으로 로컬 folders 배열을 직접 고쳐서 다시 그린다. Cloudflare
// Workers KV는 쓰기 직후 읽기가 즉시 반영된다고 보장하지 않는(eventual consistency)
// 저장소라, 쓰자마자 목록을 재조회하면 방금 한 변경이 아직 안 보이는 경우가 실제로
// 있었다(운영 중 확인됨) — 응답으로 받은 값을 그대로 신뢰하는 편이 더 정확하고 빠르다.
function createFolderUI() {
  openNamePrompt('새 폴더 이름', '', async name => {
    try {
      const folder = await Engine.Storage.createFolder(name);
      folders.push(folder);
      renderFolderGrid();
      showToast('"' + name + '" 폴더를 만들었어요');
    } catch (e) { showToast('폴더를 만들지 못했어요 — 네트워크 상태를 확인해주세요'); }
  });
}
function renameFolderUI(folderId) {
  const f = folders.find(x => x.id === folderId); if (!f) return;
  openNamePrompt('폴더 이름 변경', f.name, async name => {
    try {
      const updated = await Engine.Storage.renameFolder(folderId, name);
      f.name = updated.name;
      renderFolderGrid();
      showToast('이름을 바꿨어요');
    } catch (e) { showToast('이름을 바꾸지 못했어요'); }
  });
}
async function deleteFolderUI(folderId) {
  const f = folders.find(x => x.id === folderId); if (!f) return;
  const books = await Engine.Storage.listBooks(folderId);
  const msg = books.length
    ? `"${f.name}" 폴더 안의 자료 ${books.length}개가 모두 삭제됩니다. 계속할까요?\n되돌릴 수 없습니다.`
    : `"${f.name}" 폴더를 삭제할까요?`;
  if (!confirm(msg)) return;
  try {
    await Engine.Storage.deleteFolder(folderId);
    folders = folders.filter(x => x.id !== folderId);
    renderFolderGrid();
    showToast('삭제했어요');
  } catch (e) { showToast('삭제하지 못했어요 — 네트워크 상태를 확인해주세요'); }
}

/* ── 이름 입력 팝업(폴더 새로 만들기/이름 변경 공용) ── */
let namePromptOnConfirm = null;
function openNamePrompt(title, defaultValue, onConfirm) {
  document.getElementById('np-title').textContent = title;
  const input = document.getElementById('np-input'); input.value = defaultValue || '';
  namePromptOnConfirm = onConfirm;
  document.getElementById('name-prompt-modal').classList.add('open');
  setTimeout(() => { input.focus(); input.select(); }, 50);
}
function closeNamePrompt(confirmed) {
  document.getElementById('name-prompt-modal').classList.remove('open');
  const cb = namePromptOnConfirm; namePromptOnConfirm = null;
  if (!confirmed || !cb) return;
  const name = document.getElementById('np-input').value.trim();
  if (name) cb(name);
}

function renderSubjectGrid() {
  const grid = document.getElementById('subject-grid');
  grid.innerHTML = subjects.map(s => `
    <div class="subject-card" style="background:${s.color || '#888'};" onclick="openSubject('${s.viewer}')">
      <div class="sc-icon">${s.icon || '📘'}</div>
      <div class="sc-name">${s.name}</div>
    </div>`).join('');
  // subjects.json에 아직 없는 나머지 과목은 "준비 중" 카드로 표시해 향후 확장을 미리 보여준다.
  const PLANNED = [
    { id: 'math', name: '수학', icon: '📐', color: '#1a3a6b' },
    { id: 'english', name: '영어', icon: '🔤', color: '#7b4fbf' },
    { id: 'korean', name: '국어', icon: '📖', color: '#c0392b' },
    { id: 'hanja', name: '한자', icon: '字', color: '#8a6d3b' },
    { id: 'chinese', name: '중국어', icon: '🇨🇳', color: '#b03a2e' },
    { id: 'japanese', name: '일본어', icon: '🇯🇵', color: '#c2185b' },
  ].filter(p => !subjects.some(s => s.id === p.id));
  grid.innerHTML += PLANNED.map(p => `
    <div class="subject-card coming-soon" style="background:${p.color};">
      <span class="sc-badge">준비 중</span>
      <div class="sc-icon">${p.icon}</div>
      <div class="sc-name">${p.name}</div>
    </div>`).join('');
}
function openSubject(viewerPath) { if (viewerPath) location.href = viewerPath; }

/* ── 최근 학습 ── */
function renderRecent() {
  const recents = Engine.Storage.getRecents();
  const grid = document.getElementById('recent-grid');
  if (!recents.length) { grid.innerHTML = '<div class="empty-hint">아직 열어본 교재가 없어요 — 아래 과목에서 교재를 선택해보세요.</div>'; return; }
  grid.innerHTML = recents.slice(0, 2).map(r => {
    const subj = subjects.find(s => s.id === r.subjectId) || archives.find(a => a.id === r.subjectId);
    const subjLabel = subj ? (subj.icon + ' ' + subj.name) : (r.subjectId === 'workspace' ? '📁 나의 폴더' : r.subjectId);
    return `<div class="recent-card" onclick="openRecent('${r.viewerPath}','${r.bookId}')">
      <div class="rc-subject">${subjLabel}</div>
      <div class="rc-title">${escapeHtml(r.title)}</div>
      <div class="rc-time">${relativeTimeKo(r.openedAt)}</div>
    </div>`;
  }).join('');
}
function openRecent(viewerPath, bookId) { location.href = viewerPath + '?book=' + encodeURIComponent(bookId); }
function relativeTimeKo(iso) {
  if (!iso) return '';
  const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (min < 1) return '방금'; if (min < 60) return min + '분 전';
  const hr = Math.round(min / 60); if (hr < 24) return hr + '시간 전';
  return new Date(iso).toLocaleDateString('ko-KR');
}

/* ── 상태 바 ── */
async function refreshStatusline() {
  const online = await Engine.Storage.ping(2500);
  const sl = document.getElementById('statusline');
  sl.classList.toggle('online', online); sl.classList.toggle('offline', !online);
  document.getElementById('sl-server').textContent = online ? '서버 연결됨' : '오프라인 모드 · 캐시된 자료';
  document.getElementById('sl-device').textContent = Engine.Device.getLabel();
  const recents = Engine.Storage.getRecents();
  document.getElementById('sl-lastsync').textContent = recents.length ? relativeTimeKo(recents[0].openedAt) : '기록 없음';
}

/* ── 통합 검색 (과목별 그룹핑) ── */
async function loadSearchData() {
  if (searchDataCache) return searchDataCache;
  const groups = [];
  for (const s of subjects.concat(archives)) {
    if (!s.searchIndexUrl) continue;
    try {
      const res = await fetch(s.searchIndexUrl, { cache: 'no-store' });
      const items = await res.json();
      groups.push({ subject: s, items });
    } catch (e) { /* 해당 과목 인덱스가 없으면 건너뜀 */ }
  }
  searchDataCache = groups;
  return groups;
}
let searchTimer = null;
function onSearchInput(val) {
  clearTimeout(searchTimer);
  if (!val.trim()) { document.getElementById('search-results').style.display = 'none'; return; }
  searchTimer = setTimeout(() => runSearch(val.trim()), 200);
}
async function runSearch(query) {
  const q = query.toLowerCase();
  const groups = await loadSearchData();
  const box = document.getElementById('search-results');
  let html = '';
  let totalHits = 0;
  groups.forEach(g => {
    const hits = g.items.filter(it => (it.label + ' ' + (it.sub || '')).toLowerCase().includes(q)).slice(0, 6);
    if (!hits.length) return;
    totalHits += hits.length;
    html += `<div class="search-group-title">${g.subject.icon} ${g.subject.name}</div>`;
    html += hits.map(it => `<div class="search-item" onclick="goToSearchResult('${g.subject.viewer}','${it.bookId}',${it.page})">
      <span class="si-badge">${it.page}p</span>
      <div><div class="si-text">${it.label}</div><div class="si-sub">${it.sub || ''}</div></div>
    </div>`).join('');
  });
  box.innerHTML = totalHits ? html : `<div class="search-empty">🔍 "${query}" 검색 결과 없음</div>`;
  box.style.display = '';
}
function goToSearchResult(viewerPath, bookId, page) {
  location.href = viewerPath + '?book=' + encodeURIComponent(bookId) + '&page=' + encodeURIComponent(page);
}
function clearSearch() { document.getElementById('search-input').value = ''; document.getElementById('search-results').style.display = 'none'; }
document.addEventListener('click', e => { if (!e.target.closest('.search-wrap')) document.getElementById('search-results').style.display = 'none'; });

/* ── PWA ── */
if ('serviceWorker' in navigator) {
  Engine.PWA.registerServiceWorker('./sw.js', {
    onRegistered: () => Engine.PWA.precacheAll('kth-content-v1', ['./index.html', './subjects.json', './archives.json', './manifest.json', './shared/annotation-engine.js'], {})
  });
}

(async function init() {
  await loadSubjects();
  await loadArchives();
  await loadFolders();
  renderRecent();
  refreshStatusline();
  setInterval(refreshStatusline, 30000);
})();
</script>
